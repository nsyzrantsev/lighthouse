[project]
name = "lighthouse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "easydict==1.13",
  "pandas==2.3.3",
  "tqdm==4.67.1",
  "pyyaml==6.0.3",
  "scikit-learn==1.7.2",
  "ffmpeg-python==0.2.0",
  "ftfy==6.3.1",
  "regex==2025.11.3",
  "einops==0.8.1",
  "fvcore==0.1.5.post20221221",
  "gradio==5.49.1",
  "torchlibrosa==0.1.0",
  "librosa==0.10.2.post1",
  "msclap==1.3.4",
  "transformers==4.57.1",
  "numpy==1.26.4",
  "clip==1.0",
]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git", rev = "dcba3cb2e2827b402d2701e7e1c7d9fed8a20ef1" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools.packages.find]
exclude = ["training*"]
